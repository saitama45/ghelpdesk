name: Deploy Laravel to Azure and MonsterASP

on:
  push:
    branches:
      - master
  # Manual "Run workflow" button. A push whose ref update lands but whose receive
  # operation errors out (the "cannot lock ref ... is at X but expected Y" race)
  # advances master WITHOUT emitting a push event, so the commit sits on GitHub
  # with no run and never deploys. Re-running the previous run is no help — it
  # redeploys the older SHA. This lets that commit be deployed without inventing
  # an empty commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: fileinfo, mbstring, xml, gd, zip, pdo_sqlsrv, sqlsrv
          ini-values: post_max_size=256M, max_execution_time=180

      - name: Install Composer Dependencies
        # --no-dev keeps phpunit, pint, sail, faker, etc. out of the package:
        # nothing in production uses them, and fewer files make the Azure zip
        # smaller and any FTP sync quicker.
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM Dependencies & Build
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build
          fi

      - name: Create Storage Link
        run: php artisan storage:link

      - name: Prepare Deployment Artifact
        run: |
          mkdir -p build_output
          # Use rsync to copy everything except the build folder itself and unnecessary heavy folders.
          rsync -ar . build_output/ --exclude build_output --exclude node_modules --exclude .git --exclude tests --exclude android

          # Ensure storage framework directories exist and contain a dummy file so FTP uploads them.
          mkdir -p build_output/storage/framework/cache/data
          mkdir -p build_output/storage/framework/sessions
          mkdir -p build_output/storage/framework/views
          mkdir -p build_output/storage/logs
          touch build_output/storage/framework/cache/data/index.html
          touch build_output/storage/framework/sessions/index.html
          touch build_output/storage/framework/views/index.html
          touch build_output/storage/logs/index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-app
          path: build_output/

  deploy-azure:
    name: Deploy to Azure
    needs: build
    runs-on: ubuntu-latest
    # Locks are per target, never workflow-wide: a slow FTP sync must not hold
    # back the next Azure deploy. Each target still deploys (and migrates its
    # own database) one run at a time.
    concurrency:
      group: deploy-azure
      cancel-in-progress: false

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-app
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: TASTicketing
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

  deploy-monsterasp:
    name: Deploy to ${{ matrix.display_name }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ matrix.ftp_server_secret }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: MonsterASP primary
            ftp_server_secret: FTP_SERVER
            ftp_username_secret: FTP_USERNAME
            ftp_password_secret: FTP_PASSWORD
            env_file_secret: MONSTERASP_ENV_FILE
          - display_name: MonsterASP GALGATIX
            ftp_server_secret: FTP_SERVER_GALGATIX
            ftp_username_secret: FTP_USERNAME_GALGATIX
            ftp_password_secret: FTP_PASSWORD_GALGATIX
            env_file_secret: GALGATIX_ENV_FILE

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-app
          path: .

      - name: Create server-specific Laravel environment
        shell: bash
        env:
          DEPLOY_ENV_FILE: ${{ secrets[matrix.env_file_secret] }}
        run: |
          if [ -z "$DEPLOY_ENV_FILE" ]; then
            echo "::error::The ${{ matrix.env_file_secret }} GitHub secret is missing or empty."
            exit 1
          fi

          # Keep each server's complete production configuration in its own
          # encrypted GitHub secret; never commit or print it in the workflow.
          printf '%s\n' "$DEPLOY_ENV_FILE" > .env
          chmod 600 .env

      - name: Run database migrations for ${{ matrix.display_name }}
        shell: bash
        run: |
          php artisan config:clear
          php artisan migrate --force --no-interaction

      - name: Deploy to ${{ matrix.display_name }} by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[matrix.ftp_server_secret] }}
          username: ${{ secrets[matrix.ftp_username_secret] }}
          password: ${{ secrets[matrix.ftp_password_secret] }}
          protocol: ftp
          port: 21
          timeout: 120000
          # Keep the action's DEFAULT state file (.ftp-deploy-sync-state.json).
          # It already lives on both servers and lists what is uploaded, so only
          # changed files are sent. Renaming it makes the action treat the server
          # as empty and re-upload the whole app (vendor included) file by file —
          # over an hour. Each server is its own FTP account, so they never clash.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md

      - name: Remove local environment file
        if: always()
        shell: bash
        run: rm -f .env

name: Deploy Laravel to Azure and MonsterASP

on:
  push:
    branches:
      - master
  # Manual "Run workflow" button. A push whose ref update lands but whose receive
  # operation errors out (the "cannot lock ref ... is at X but expected Y" race)
  # advances master WITHOUT emitting a push event, so the commit sits on GitHub
  # with no run and never deploys. Re-running the previous run is no help — it
  # redeploys the older SHA. This lets that commit be deployed without inventing
  # an empty commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: fileinfo, mbstring, xml, gd, zip, pdo_sqlsrv, sqlsrv
          ini-values: post_max_size=256M, max_execution_time=180
          # Ubuntu runners enable Xdebug by default; nothing here measures
          # coverage and it only slows composer/artisan down.
          coverage: none

      - name: Install Composer Dependencies
        # --no-dev keeps phpunit, pint, sail, faker, etc. out of the package:
        # nothing in production uses them, and fewer files make the Azure zip
        # smaller and any FTP sync quicker.
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM Dependencies & Build
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build
          fi

      - name: Create Storage Link
        run: php artisan storage:link

      - name: Prepare Deployment Artifact
        run: |
          mkdir -p build_output
          # Use rsync to copy everything except the build folder itself and unnecessary heavy folders.
          rsync -ar . build_output/ --exclude build_output --exclude node_modules --exclude .git --exclude tests --exclude android

          # Ensure storage framework directories exist and contain a dummy file so FTP uploads them.
          mkdir -p build_output/storage/framework/cache/data
          mkdir -p build_output/storage/framework/sessions
          mkdir -p build_output/storage/framework/views
          mkdir -p build_output/storage/logs
          touch build_output/storage/framework/cache/data/index.html
          touch build_output/storage/framework/sessions/index.html
          touch build_output/storage/framework/views/index.html
          touch build_output/storage/logs/index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-app
          path: build_output/

  deploy-azure:
    name: Deploy to Azure
    needs: build
    runs-on: ubuntu-latest
    # Locks are per target, never workflow-wide: a slow FTP sync must not hold
    # back the next Azure deploy. Each target still deploys (and migrates its
    # own database) one run at a time.
    concurrency:
      group: deploy-azure
      cancel-in-progress: false

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-app
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: TASTicketing
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

  deploy-monsterasp:
    name: Deploy to ${{ matrix.display_name }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ matrix.ftp_server_secret }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: MonsterASP primary
            ftp_server_secret: FTP_SERVER
            ftp_username_secret: FTP_USERNAME
            ftp_password_secret: FTP_PASSWORD
            env_file_secret: MONSTERASP_ENV_FILE
          - display_name: MonsterASP GALGATIX
            ftp_server_secret: FTP_SERVER_GALGATIX
            ftp_username_secret: FTP_USERNAME_GALGATIX
            ftp_password_secret: FTP_PASSWORD_GALGATIX
            env_file_secret: GALGATIX_ENV_FILE

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-app
          path: .

      # This job RUNS PHP (artisan migrate) against each server's database, but had
      # no PHP setup of its own - it used whatever the runner image ships, which
      # is an unpinned PHP with Xdebug ENABLED by default.
      #
      # Deploys with nothing to migrate passed; the first deploy that actually ran
      # DDL died with SIGSEGV (exit 139) on both servers. The connection itself was
      # fine (migrate had already SELECTed the migrations table to get that far), and
      # a bad statement would raise a SQLSTATE error rather than crash the process -
      # so the fault is native, in the interpreter/extension, not in the SQL.
      #
      # Pinning the same PHP and extensions as the build job, with `coverage: none`
      # to drop Xdebug (a well-known source of native crashes in CI), removes those
      # variables. The report step below prints the interpreter, the PDO drivers and
      # whether Xdebug is loaded, so if this ever fails again the log identifies it
      # instead of leaving it to be guessed at.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: fileinfo, mbstring, xml, gd, zip, pdo_sqlsrv, sqlsrv
          ini-values: post_max_size=256M, max_execution_time=180
          coverage: none

      # The sqlsrv/pdo_sqlsrv extensions are only a wrapper: they talk to SQL
      # Server through Microsoft's ODBC driver, which must be installed on the
      # machine. The runner image no longer ships it, so every migrate failed
      # with "SQLSTATE[IMSSP]: This extension requires the Microsoft ODBC Driver
      # for SQL Server" before FTP ran, and neither MonsterASP site was updated.
      # Installed explicitly here, and skipped when the image already has it.
      - name: Install the Microsoft ODBC driver for SQL Server
        shell: bash
        run: |
          if odbcinst -q -d 2>/dev/null | grep -q "ODBC Driver 18 for SQL Server"; then
            echo "ODBC Driver 18 for SQL Server is already installed."
            exit 0
          fi

          # Reuse the image's packages.microsoft.com source when it has one;
          # adding a second entry with a different key makes apt refuse to run.
          if ! grep -rqs "packages.microsoft.com/ubuntu" /etc/apt/sources.list /etc/apt/sources.list.d/; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/microsoft-prod.list > /dev/null
          fi

          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc
          odbcinst -q -d

      - name: Create server-specific Laravel environment
        shell: bash
        env:
          DEPLOY_ENV_FILE: ${{ secrets[matrix.env_file_secret] }}
        run: |
          if [ -z "$DEPLOY_ENV_FILE" ]; then
            echo "::error::The ${{ matrix.env_file_secret }} GitHub secret is missing or empty."
            exit 1
          fi

          # Keep each server's complete production configuration in its own
          # encrypted GitHub secret; never commit or print it in the workflow.
          printf '%s\n' "$DEPLOY_ENV_FILE" > .env
          chmod 600 .env

      # Names the interpreter and driver in the log, so a failure here says what
      # it was actually running instead of leaving it to be guessed at.
      - name: Report the migration runtime for ${{ matrix.display_name }}
        shell: bash
        run: |
          php -v | head -n 1
          echo "PDO drivers: $(php -r 'echo implode(", ", PDO::getAvailableDrivers());')"
          echo "Xdebug loaded: $(php -r 'echo extension_loaded("xdebug") ? "yes" : "no";')"
          echo "ODBC drivers: $(odbcinst -q -d | tr '\n' ' ')"
          php artisan config:clear
          php artisan about --only=drivers

      # `-d xdebug.mode=off` belt-and-braces: `coverage: none` above already removes
      # Xdebug, and this makes the run inert even if the image reinstates it. An
      # unknown ini key is simply ignored when the extension is absent.
      - name: Run database migrations for ${{ matrix.display_name }}
        shell: bash
        run: php -d xdebug.mode=off artisan migrate --force --no-interaction

      - name: Deploy to ${{ matrix.display_name }} by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets[matrix.ftp_server_secret] }}
          username: ${{ secrets[matrix.ftp_username_secret] }}
          password: ${{ secrets[matrix.ftp_password_secret] }}
          protocol: ftp
          port: 21
          timeout: 120000
          # Keep the action's DEFAULT state file (.ftp-deploy-sync-state.json).
          # It already lives on both servers and lists what is uploaded, so only
          # changed files are sent. Renaming it makes the action treat the server
          # as empty and re-upload the whole app (vendor included) file by file —
          # over an hour. Each server is its own FTP account, so they never clash.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            README.md

      - name: Remove local environment file
        if: always()
        shell: bash
        run: rm -f .env
